name: OpenTofu CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

env:
    TOFU_VERSION: "~> 1.11"

jobs:
    validate:
        name: Validate
        runs-on: ubuntu-latest
        permissions:
            id-token: write
            contents: read
        steps:
            - name: Checkout
              uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

            - name: Setup OpenTofu
              uses: opentofu/setup-opentofu@847eaa4afeb791b06daa46e8eafa8b1b68d7cfb4 # v2.0.1
              with:
                  tofu_version: ${{ env.TOFU_VERSION }}
                  tofu_wrapper: false

            - name: Cache OpenTofu plugins
              uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
              with:
                  path: ~/.terraform.d/plugin-cache
                  key: ${{ runner.os }}-tofu-${{ hashFiles('.terraform.lock.hcl') }}

            - name: Create plugin cache dir
              run: |
                  mkdir -p "$HOME/.terraform.d/plugin-cache"
                  echo "TF_PLUGIN_CACHE_DIR=$HOME/.terraform.d/plugin-cache" >> "$GITHUB_ENV"

            - name: Configure module auth
              env:
                  TF_MODULES_TOKEN: ${{ secrets.TF_MODULES_TOKEN }}
              run: |
                  git config --global \
                    url."https://oauth2:${TF_MODULES_TOKEN}@github.com/".insteadOf \
                    "ssh://git@github.com/"

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v6.2.0
              with:
                  role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
                  aws-region: us-east-1

            - name: OpenTofu Format Check
              run: tofu fmt -check -recursive

            - name: OpenTofu Init
              run: tofu init

            - name: OpenTofu Validate
              run: tofu validate

            - name: Setup TFLint
              uses: terraform-linters/setup-tflint@b480b8fcdaa6f2c577f8e4fa799e89e756bb7c93 # v6.2.2

            - name: TFLint Init
              run: tflint --init --config=.tflint.hcl

            - name: TFLint
              run: tflint --config=.tflint.hcl

            - name: Trivy
              uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
              with:
                  scan-type: config
                  scan-ref: .
                  trivy-config: trivy.yml

    plan:
        name: Plan
        needs: validate
        runs-on: ubuntu-latest
        permissions:
            id-token: write
            contents: read
        steps:
            - name: Checkout
              uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

            - name: Setup OpenTofu
              uses: opentofu/setup-opentofu@847eaa4afeb791b06daa46e8eafa8b1b68d7cfb4 # v2.0.1
              with:
                  tofu_version: ${{ env.TOFU_VERSION }}
                  tofu_wrapper: false

            - name: Cache OpenTofu plugins
              uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
              with:
                  path: ~/.terraform.d/plugin-cache
                  key: ${{ runner.os }}-tofu-${{ hashFiles('.terraform.lock.hcl') }}

            - name: Create plugin cache dir
              run: |
                  mkdir -p "$HOME/.terraform.d/plugin-cache"
                  echo "TF_PLUGIN_CACHE_DIR=$HOME/.terraform.d/plugin-cache" >> "$GITHUB_ENV"

            - name: Configure module auth
              env:
                  TF_MODULES_TOKEN: ${{ secrets.TF_MODULES_TOKEN }}
              run: |
                  git config --global \
                    url."https://oauth2:${TF_MODULES_TOKEN}@github.com/".insteadOf \
                    "ssh://git@github.com/"

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v6.2.0
              with:
                  role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
                  aws-region: us-east-1

            - name: OpenTofu Init
              run: tofu init

            - name: OpenTofu Plan
              run: tofu plan -out=tfplan

            - name: Upload Plan
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: tfplan
                  path: tfplan
                  retention-days: 7
