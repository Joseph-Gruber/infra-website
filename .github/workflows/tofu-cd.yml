name: OpenTofu CD

on:
    workflow_dispatch:

env:
    TOFU_VERSION: "~> 1.11"

jobs:
    validate:
        name: Validate
        runs-on: ubuntu-latest
        permissions:
            id-token: write
            contents: read
        steps:
            - name: Checkout
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

            - name: Setup OpenTofu
              uses: opentofu/setup-opentofu@fc711fa910b93cba0f3fbecaafc9f42fd0c411cb # v2.0.0
              with:
                  tofu_version: ${{ env.TOFU_VERSION }}
                  tofu_wrapper: false

            - name: Cache OpenTofu plugins
              uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
              with:
                  path: ~/.terraform.d/plugin-cache
                  key: ${{ runner.os }}-tofu-${{ hashFiles('.terraform.lock.hcl') }}

            - name: Create plugin cache dir
              run: |
                  mkdir -p "$HOME/.terraform.d/plugin-cache"
                  echo "TF_PLUGIN_CACHE_DIR=$HOME/.terraform.d/plugin-cache" >> "$GITHUB_ENV"

            - name: Configure module auth
              env:
                  TF_MODULES_TOKEN: ${{ secrets.TF_MODULES_TOKEN }}
              run: |
                  git config --global \
                    url."https://oauth2:${TF_MODULES_TOKEN}@github.com/".insteadOf \
                    "ssh://git@github.com/"

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@d979d5b3a71173a29b74b5b88418bfda9437d885 # v6.1.1
              with:
                  role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
                  aws-region: us-east-1

            - name: OpenTofu Format Check
              run: tofu fmt -check -recursive

            - name: OpenTofu Init
              run: tofu init

            - name: OpenTofu Validate
              run: tofu validate

            - name: Setup TFLint
              uses: terraform-linters/setup-tflint@b480b8fcdaa6f2c577f8e4fa799e89e756bb7c93 # v6.2.2

            - name: TFLint Init
              run: tflint --init --config=.tflint.hcl

            - name: TFLint
              run: tflint --config=.tflint.hcl

            - name: Trivy
              uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
              with:
                  scan-type: config
                  scan-ref: .
                  trivy-config: trivy.yml

    plan:
        name: Plan
        needs: validate
        runs-on: ubuntu-latest
        permissions:
            id-token: write
            contents: read
        steps:
            - name: Checkout
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

            - name: Setup OpenTofu
              uses: opentofu/setup-opentofu@fc711fa910b93cba0f3fbecaafc9f42fd0c411cb # v2.0.0
              with:
                  tofu_version: ${{ env.TOFU_VERSION }}
                  tofu_wrapper: false

            - name: Cache OpenTofu plugins
              uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
              with:
                  path: ~/.terraform.d/plugin-cache
                  key: ${{ runner.os }}-tofu-${{ hashFiles('.terraform.lock.hcl') }}

            - name: Create plugin cache dir
              run: |
                  mkdir -p "$HOME/.terraform.d/plugin-cache"
                  echo "TF_PLUGIN_CACHE_DIR=$HOME/.terraform.d/plugin-cache" >> "$GITHUB_ENV"

            - name: Configure module auth
              env:
                  TF_MODULES_TOKEN: ${{ secrets.TF_MODULES_TOKEN }}
              run: |
                  git config --global \
                    url."https://oauth2:${TF_MODULES_TOKEN}@github.com/".insteadOf \
                    "ssh://git@github.com/"

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@d979d5b3a71173a29b74b5b88418bfda9437d885 # v6.1.1
              with:
                  role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
                  aws-region: us-east-1

            - name: OpenTofu Init
              run: tofu init

            - name: OpenTofu Plan
              run: tofu plan -out=tfplan

            - name: Upload Plan
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: tfplan
                  path: tfplan
                  retention-days: 7

    apply:
        name: Apply
        needs: plan
        runs-on: ubuntu-latest
        permissions:
            id-token: write
            contents: read
        steps:
            - name: Checkout
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

            - name: Setup OpenTofu
              uses: opentofu/setup-opentofu@fc711fa910b93cba0f3fbecaafc9f42fd0c411cb # v2.0.0
              with:
                  tofu_version: ${{ env.TOFU_VERSION }}
                  tofu_wrapper: false

            - name: Cache OpenTofu plugins
              uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
              with:
                  path: ~/.terraform.d/plugin-cache
                  key: ${{ runner.os }}-tofu-${{ hashFiles('.terraform.lock.hcl') }}

            - name: Create plugin cache dir
              run: |
                  mkdir -p "$HOME/.terraform.d/plugin-cache"
                  echo "TF_PLUGIN_CACHE_DIR=$HOME/.terraform.d/plugin-cache" >> "$GITHUB_ENV"

            - name: Configure module auth
              env:
                  TF_MODULES_TOKEN: ${{ secrets.TF_MODULES_TOKEN }}
              run: |
                  git config --global \
                    url."https://oauth2:${TF_MODULES_TOKEN}@github.com/".insteadOf \
                    "ssh://git@github.com/"

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@d979d5b3a71173a29b74b5b88418bfda9437d885 # v6.1.1
              with:
                  role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
                  aws-region: us-east-1

            - name: OpenTofu Init
              run: tofu init

            - name: Download Plan
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  name: tfplan

            - name: OpenTofu Apply
              run: tofu apply -lock-timeout=10m tfplan
